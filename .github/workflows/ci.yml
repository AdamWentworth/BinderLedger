name: ci

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
      - name: Test
        run: go test ./cmd/... ./internal/...
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Verify module files
        run: go mod tidy -diff
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run doctor
      - run: npm run export:web

  collectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm test
        working-directory: tools/justtcg-audit

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement services/vision/requirements.txt
      - name: Build deployed test environment
        run: docker build --pull --target test -t binderledger-vision:test -f services/vision/Dockerfile .
      - name: Test matcher
        run: docker run --rm binderledger-vision:test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: binderledger_ci
          POSTGRES_USER: binderledger_ci
          POSTGRES_PASSWORD: binderledger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U binderledger_ci -d binderledger_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
      - name: Apply every migration to an empty database
        env:
          DATABASE_URL: postgres://binderledger_ci:binderledger_ci@127.0.0.1:5432/binderledger_ci?sslmode=disable
        run: go run ./cmd/migrate

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: |
          shellcheck ops/prod/scripts/*.sh
          bash -n ops/prod/scripts/*.sh
      - name: Validate production Compose
        run: >-
          docker compose
          --project-directory ops/prod
          -f ops/prod/docker-compose.yml
          --env-file ops/prod/binderledger.env.example
          --env-file ops/prod/images.env.example
          config >/dev/null

  images:
    if: github.event_name != 'pull_request'
    needs: [go, client, collectors, vision, database, operations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: |
          docker build --pull -t binderledger-core:ci -f Dockerfile .
          docker build --pull --target runtime -t binderledger-vision:ci -f services/vision/Dockerfile .
          docker build --pull -t binderledger-web:ci -f apps/client/Dockerfile .
          docker build --pull -t binderledger-collector:ci -f tools/justtcg-audit/Dockerfile .
