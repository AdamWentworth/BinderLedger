name: ci

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Test
        run: go test ./cmd/... ./internal/...
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Verify module files
        run: go mod tidy -diff
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run doctor
      - run: npm run export:web

  collectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm test
        working-directory: tools/justtcg-audit

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement services/vision/requirements.txt
      - name: Build deployed test environment
        run: docker build --pull --target test -t binderledger-vision:test -f services/vision/Dockerfile .
      - name: Test matcher
        run: docker run --rm binderledger-vision:test

  images:
    if: github.event_name != 'pull_request'
    needs: [go, client, collectors, vision]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CORE_IMAGE: ghcr.io/adamwentworth/binderledger-core
      VISION_IMAGE: ghcr.io/adamwentworth/binderledger-vision
      WEB_IMAGE: ghcr.io/adamwentworth/binderledger-web
      COLLECTOR_IMAGE: ghcr.io/adamwentworth/binderledger-collector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate production Compose
        run: >-
          docker compose
          --project-directory ops/prod
          -f ops/prod/docker-compose.yml
          --env-file ops/prod/binderledger.env.example
          --env-file ops/prod/images.env.example
          config >/dev/null

      - name: Build images
        run: |
          docker build --pull -t binderledger-core:ci -f Dockerfile .
          docker build --pull --target runtime -t binderledger-vision:ci -f services/vision/Dockerfile .
          docker build --pull -t binderledger-web:ci -f apps/client/Dockerfile .
          docker build --pull -t binderledger-collector:ci -f tools/justtcg-audit/Dockerfile .

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish SHA and latest tags
        run: |
          for spec in \
            "binderledger-core:ci ${CORE_IMAGE}" \
            "binderledger-vision:ci ${VISION_IMAGE}" \
            "binderledger-web:ci ${WEB_IMAGE}" \
            "binderledger-collector:ci ${COLLECTOR_IMAGE}"; do
            set -- ${spec}
            docker tag "$1" "$2:sha-${GITHUB_SHA}"
            docker tag "$1" "$2:latest"
            docker push "$2:sha-${GITHUB_SHA}"
            docker push "$2:latest"
          done
