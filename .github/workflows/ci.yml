name: ci

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
      - name: Test
        run: |
          go test ./cmd/... ./internal/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files need gofmt:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Verify module files
        run: go mod tidy -diff
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run doctor
      - run: npm run export:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  collectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/justtcg-audit/package-lock.json
      - run: npm ci
        working-directory: tools/justtcg-audit
      - run: npm run lint
        working-directory: tools/justtcg-audit
      - run: npm test
        working-directory: tools/justtcg-audit

  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement services/vision/requirements.txt
      - name: Build deployed test environment
        run: docker build --pull --target test -t binderledger-vision:test -f services/vision/Dockerfile .
      - name: Lint, format-check, and test vision service
        run: docker run --rm binderledger-vision:test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: binderledger_ci
          POSTGRES_USER: binderledger_ci
          POSTGRES_PASSWORD: binderledger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U binderledger_ci -d binderledger_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
      - name: Apply every migration to an empty database
        env:
          DATABASE_URL: postgres://binderledger_ci:binderledger_ci@127.0.0.1:5432/binderledger_ci?sslmode=disable
        run: go run ./cmd/migrate
      - name: Exercise database-backed API routes
        env:
          BINDERLEDGER_INTEGRATION_DATABASE_URL: postgres://binderledger_ci:binderledger_ci@127.0.0.1:5432/binderledger_ci?sslmode=disable
        run: go test ./internal/httpapi -run TestDatabaseBackedReadRoutes -count=1
      - name: Roll back and reapply the latest migration
        env:
          DATABASE_URL: postgres://binderledger_ci:binderledger_ci@127.0.0.1:5432/binderledger_ci?sslmode=disable
        run: |
          go run ./cmd/migrate -direction=down
          go run ./cmd/migrate

  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: |
          shellcheck scripts/*.sh
          bash -n scripts/*.sh
      - name: Check repository hygiene
        run: bash scripts/check-repository.sh

  images:
    if: github.event_name != 'pull_request'
    needs: [go, client, collectors, vision, database, operations]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      CORE_IMAGE: ghcr.io/adamwentworth/binderledger-core
      VISION_IMAGE: ghcr.io/adamwentworth/binderledger-vision
      WEB_IMAGE: ghcr.io/adamwentworth/binderledger-web
      COLLECTOR_IMAGE: ghcr.io/adamwentworth/binderledger-collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: |
          docker build --pull --label org.opencontainers.image.revision=${GITHUB_SHA} -t binderledger-core:ci-${GITHUB_SHA} -f Dockerfile .
          docker build --pull --label org.opencontainers.image.revision=${GITHUB_SHA} --target runtime -t binderledger-vision:ci-${GITHUB_SHA} -f services/vision/Dockerfile .
          docker build --pull --label org.opencontainers.image.revision=${GITHUB_SHA} -t binderledger-web:ci-${GITHUB_SHA} -f apps/client/Dockerfile .
          docker build --pull --label org.opencontainers.image.revision=${GITHUB_SHA} -t binderledger-collector:ci-${GITHUB_SHA} -f tools/justtcg-audit/Dockerfile .

      - name: Smoke test hardened web image
        run: |
          set -euo pipefail
          docker run --detach \
            --name binderledger-web-ci \
            --user 101:101 \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --memory 96m \
            --memory-swap 128m \
            --pids-limit 64 \
            --tmpfs /var/cache/nginx:size=16m,uid=101,gid=101 \
            --tmpfs /var/run:size=2m,uid=101,gid=101 \
            --publish 127.0.0.1:8081:8080 \
            binderledger-web:ci-${GITHUB_SHA}
          trap 'docker logs binderledger-web-ci; docker rm --force binderledger-web-ci' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8081/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8081/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/scan >/dev/null

      - name: Scan production images
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          scan_failed=0
          for image in \
            binderledger-core:ci-${GITHUB_SHA} \
            binderledger-vision:ci-${GITHUB_SHA} \
            binderledger-web:ci-${GITHUB_SHA} \
            binderledger-collector:ci-${GITHUB_SHA}; do
            if ! docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/" \
              ghcr.io/aquasecurity/trivy:0.74.0 \
              image \
              --pkg-types os,library \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              "$image"; then
              scan_failed=1
            fi
          done
          exit "$scan_failed"

      - name: Generate CycloneDX image SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          for image in \
            binderledger-core:ci-${GITHUB_SHA} \
            binderledger-vision:ci-${GITHUB_SHA} \
            binderledger-web:ci-${GITHUB_SHA} \
            binderledger-collector:ci-${GITHUB_SHA}; do
            component="${image%%:*}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/" \
              -v "$PWD/sbom:/sbom" \
              ghcr.io/aquasecurity/trivy:0.74.0 \
              image \
              --format cyclonedx \
              --output "/sbom/${component}.cdx.json" \
              "$image"
          done
      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: binderledger-sboms-${{ github.sha }}
          path: sbom/*.cdx.json

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable images
        run: |
          set -euo pipefail
          for spec in \
            "binderledger-core:ci-${GITHUB_SHA} ${CORE_IMAGE}" \
            "binderledger-vision:ci-${GITHUB_SHA} ${VISION_IMAGE}" \
            "binderledger-web:ci-${GITHUB_SHA} ${WEB_IMAGE}" \
            "binderledger-collector:ci-${GITHUB_SHA} ${COLLECTOR_IMAGE}"; do
            set -- $spec
            docker tag "$1" "$2:sha-${GITHUB_SHA}"
            docker tag "$1" "$2:latest"
            docker push "$2:sha-${GITHUB_SHA}"
            docker push "$2:latest"
          done

  request-production-deployment:
    name: Request private HomeOps deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOMEOPS_AUTO_DEPLOY == 'true'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Dispatch approved revision to HomeOps
        env:
          HOMEOPS_DISPATCH_TOKEN: ${{ secrets.HOMEOPS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEOPS_DISPATCH_TOKEN}" ]]; then
            echo "HOMEOPS_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi
          payload=$(jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            '{event_type:"deploy-binderledger",client_payload:{repository:$repository,sha:$sha}}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${HOMEOPS_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AdamWentworth/HomeOps/dispatches \
            --data "${payload}"
