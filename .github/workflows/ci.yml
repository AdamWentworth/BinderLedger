name: ci

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Test
        run: go test ./cmd/... ./internal/...
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Verify module files
        run: go mod tidy -diff
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run doctor
      - run: npm run export:web

  collectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm test
        working-directory: tools/justtcg-audit

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement services/vision/requirements.txt
      - name: Build deployed test environment
        run: docker build --pull --target test -t binderledger-vision:test -f services/vision/Dockerfile .
      - name: Test matcher
        run: docker run --rm binderledger-vision:test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: binderledger_ci
          POSTGRES_USER: binderledger_ci
          POSTGRES_PASSWORD: binderledger_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U binderledger_ci -d binderledger_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Apply every migration to an empty database
        env:
          DATABASE_URL: postgres://binderledger_ci:binderledger_ci@127.0.0.1:5432/binderledger_ci?sslmode=disable
        run: go run ./cmd/migrate

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate shell scripts
        run: |
          shellcheck ops/prod/scripts/*.sh
          bash -n ops/prod/scripts/*.sh
      - name: Validate production Compose
        run: >-
          docker compose
          --project-directory ops/prod
          -f ops/prod/docker-compose.yml
          --env-file ops/prod/binderledger.env.example
          --env-file ops/prod/images.env.example
          config >/dev/null

  images:
    if: github.event_name != 'pull_request'
    needs: [go, client, collectors, vision, database, operations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CORE_IMAGE: ghcr.io/adamwentworth/binderledger-core
      VISION_IMAGE: ghcr.io/adamwentworth/binderledger-vision
      WEB_IMAGE: ghcr.io/adamwentworth/binderledger-web
      COLLECTOR_IMAGE: ghcr.io/adamwentworth/binderledger-collector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build images
        run: |
          docker build --pull -t binderledger-core:ci-${GITHUB_SHA} -f Dockerfile .
          docker build --pull --target runtime -t binderledger-vision:ci-${GITHUB_SHA} -f services/vision/Dockerfile .
          docker build --pull -t binderledger-web:ci-${GITHUB_SHA} -f apps/client/Dockerfile .
          docker build --pull -t binderledger-collector:ci-${GITHUB_SHA} -f tools/justtcg-audit/Dockerfile .

      - name: Smoke test hardened web image
        run: |
          set -euo pipefail
          docker run --detach \
            --name binderledger-web-ci \
            --user 101:101 \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --memory 96m \
            --memory-swap 128m \
            --pids-limit 64 \
            --tmpfs /var/cache/nginx:size=16m,uid=101,gid=101 \
            --tmpfs /var/run:size=2m,uid=101,gid=101 \
            --publish 127.0.0.1:8081:8080 \
            binderledger-web:ci-${GITHUB_SHA}
          trap 'docker logs binderledger-web-ci; docker rm --force binderledger-web-ci' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8081/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8081/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/scan >/dev/null

      - name: Scan production images
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          scan_failed=0
          for image in \
            binderledger-core:ci-${GITHUB_SHA} \
            binderledger-vision:ci-${GITHUB_SHA} \
            binderledger-web:ci-${GITHUB_SHA} \
            binderledger-collector:ci-${GITHUB_SHA}; do
            if ! docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/" \
              ghcr.io/aquasecurity/trivy:0.74.0 \
              image \
              --pkg-types os,library \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              "$image"; then
              scan_failed=1
            fi
          done
          exit "$scan_failed"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable images
        run: |
          set -euo pipefail
          for spec in \
            "binderledger-core:ci-${GITHUB_SHA} ${CORE_IMAGE}" \
            "binderledger-vision:ci-${GITHUB_SHA} ${VISION_IMAGE}" \
            "binderledger-web:ci-${GITHUB_SHA} ${WEB_IMAGE}" \
            "binderledger-collector:ci-${GITHUB_SHA} ${COLLECTOR_IMAGE}"; do
            set -- $spec
            docker tag "$1" "$2:sha-${GITHUB_SHA}"
            docker tag "$1" "$2:latest"
            docker push "$2:sha-${GITHUB_SHA}"
            docker push "$2:latest"
          done
