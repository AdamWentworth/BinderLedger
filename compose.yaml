name: binderledger-dev

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: binder_ledger_dev
      POSTGRES_USER: binder_ledger_dev
      POSTGRES_PASSWORD: binder_ledger_dev
    ports:
      - "127.0.0.1:${BINDER_LEDGER_POSTGRES_PORT:-55432}:5432"
    volumes:
      - binder_ledger_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binder_ledger_dev -d binder_ledger_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 128
volumes:
  binder_ledger_postgres:
    name: binderledger_dev_postgres
