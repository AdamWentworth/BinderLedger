services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: binder_ledger_dev
      POSTGRES_USER: binder_ledger_dev
      POSTGRES_PASSWORD: binder_ledger_dev
    ports:
      - "${BINDER_LEDGER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - binder_ledger_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binder_ledger_dev -d binder_ledger_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  binder_ledger_postgres:
